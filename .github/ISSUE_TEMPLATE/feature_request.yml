name: Feature request
description: Suggest an improvement for Memiro
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and what is hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like Memiro to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
