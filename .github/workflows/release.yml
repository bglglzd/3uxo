name: release

# Собирает Windows-инсталляторы при пуше тега вида v1.2.3 и публикует
# черновик GitHub-релиза. Запускается также вручную (workflow_dispatch).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Whisper.cpp (whisper-rs) собирается через bindgen — нужен libclang.
      - name: Install LLVM (libclang for whisper-rs)
        run: choco install llvm -y --no-progress
      - name: Set LIBCLANG_PATH
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      # GPU-бэкенд Vulkan для whisper.cpp требует Vulkan SDK (glslc, заголовки).
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true

      - name: Install frontend dependencies
        run: npm ci

      # Whisper с GPU (Vulkan). Подпись апдейтов — из секретов.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Auris ${{ github.ref_name }}"
          # Сразу публикуем (не черновик), чтобы апдейтер видел новую версию.
          releaseDraft: false
          prerelease: false
          # Генерирует и прикладывает latest.json для авто-обновления.
          includeUpdaterJson: true
          # whisper.cpp с GPU (Vulkan) + диаризация (Burn) + Ogg/Opus (libopus).
          args: --features gpu,diarize,opus
