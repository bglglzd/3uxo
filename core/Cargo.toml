[package]
name = "uxo-core"
version = "0.1.0"
edition = "2021"
description = "3uxo core domain logic (no GUI dependencies)"

[lib]
name = "uxo_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hound = "3"
thiserror = "1"
ureq = { version = "2", features = ["json"] }
tempfile = "3"
# Декодирование произвольных аудиоформатов (m4a/aac, mp3, flac, ogg, wav…)
# чистым Rust — для импорта записей с телефонов и диктофонов.
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.15"
# Ogg/Opus (голосовые из мессенджеров) — symphonia Opus не декодирует.
# libopus вендорится audiopus_sys и собирается из исходников (cmake).
ogg = { version = "0.9", optional = true }
audiopus = { version = "0.2", optional = true }
whisper-rs = { version = "0.16", optional = true }
# Диаризация (разделение говорящих): segmentation-3.0 + wespeaker, инференс на
# Burn (чистый Rust, без ONNX-рантайма). Тяжёлая — только за фичей `diarize`.
native-pyannote-rs = { version = "=0.1.4", optional = true }

[features]
whisper = ["dep:whisper-rs"]
# Декодирование Ogg/Opus (libopus). Тяжёлая C-сборка — отдельно.
opus = ["dep:ogg", "dep:audiopus"]
# Диаризация (разделение говорящих). Тяжёлые ML-зависимости (Burn) — отдельно.
diarize = ["dep:native-pyannote-rs"]
# GPU-ускорение через Vulkan (быстро на NVIDIA/AMD/Intel; рантайм vulkan-1.dll
# идёт с драйвером, ничего вкладывать в установщик не нужно).
gpu = ["whisper", "whisper-rs/vulkan"]

# Реальный захват звука только на Windows. На Linux/macOS не подтягивается,
# поэтому воркспейс собирается без WASAPI.
[target.'cfg(windows)'.dependencies]
wasapi = "0.15"

[dev-dependencies]
tempfile = "3"
