[package]
name = "auris"
version = "0.1.0"
description = "Auris — ваше третье ухо"
authors = ["Auris"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "auris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset — для assetProtocol из tauri.conf.json (проигрывание аудио
# через convertFileSrc). tauri-cli добавляет её при `tauri build`, но голому
# `cargo check` нужно объявить явно.
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
uxo-core = { path = "../core" }

[features]
# Реальная транскрибация на Whisper (CPU).
whisper = ["uxo-core/whisper"]
# Whisper с GPU-ускорением (Vulkan). Включает и whisper-гейт в командах.
gpu = ["whisper", "uxo-core/gpu"]
# Диаризация (разделение говорящих в импортированных записях).
diarize = ["uxo-core/diarize"]
# Декодирование Ogg/Opus (голосовые из мессенджеров).
opus = ["uxo-core/opus"]

